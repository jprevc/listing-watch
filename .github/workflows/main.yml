name: Tests

on:
  - push
  - pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
      - run: uv sync --python 3.12 --group web --group dev
      - run: uv run pytest

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
      - run: uv sync --python 3.12 --group web --group dev
      # The demo Plugin is built against this checkout's Core, not the one on PyPI.
      - run: uv pip install ./demo/plugin
      - run: uv run --no-sync pytest demo/plugin/tests --no-cov
      - run: docker compose config --quiet

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
      - run: uv sync
      - run: uv run mypy listing_watch
      - run: uv run pylint listing_watch tests

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
      - run: uv sync --group web --group dev
      - run: uv run pytest --cov=listing_watch --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  publish-pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    needs: [test, lint]
    uses: jprevc/workflows/.github/workflows/publish-pypi.yml@v1.2.0
    with:
      python-version: '3.12'
    secrets: inherit

  publish-dockerhub:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    needs: [test, lint, publish-pypi]
    # The called workflow asks for these, and a caller can't grant more than it has itself. This
    # repo's default token is read-only.
    permissions:
      contents: read
      packages: write
    uses: jprevc/workflows/.github/workflows/publish-dockerhub.yml@v1.2.0
    secrets: inherit
