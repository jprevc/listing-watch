[build-system]
requires = [ "setuptools", "setuptools-scm",]
build-backend = "setuptools.build_meta"

[project]
name = "listing-watch"
version = "4.1.0"
description = "A self-hosted web app that watches classifieds/listings sites on a schedule and notifies you of new items, with Spiders and Notificators from Plugins."
readme = "README.md"
requires-python = ">=3.12"
keywords = [ "crawler", "listings", "classifieds", "marketplace",]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "importlib_metadata>=1.0",
]
[[project.authors]]
name = "Jost Prevc"
email = "jost.prevc@gmail.com"

[mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "importlib_metadata"
ignore_missing_imports = true

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/jprevc/listing-watch"
Repository = "https://github.com/jprevc/listing-watch"
Changelog = "https://github.com/jprevc/listing-watch/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [ "pytest", "pytest-cov", "pytest-django", "pylint", "pre-commit", "black[d]", "mypy", "django-stubs[compatible-mypy]",]
test = [ "pytest", "pytest-cov", "pytest-django",]

[dependency-groups]
dev = [ "pytest", "pytest-cov", "pytest-django", "pylint", "pre-commit", "black[d]", "mypy", "django-stubs[compatible-mypy]",]
web = [ "django>=5.0,<6", "apscheduler>=3.10,<4", "django-apscheduler>=0.7", "django-htmx>=1.17", "gunicorn>=22", "whitenoise>=6.7",]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools]
packages = [ "listing_watch",]

# Ships the type hints, so Plugins can type-check against the Plugin interface.
[tool.setuptools.package-data]
listing_watch = ["py.typed"]

[tool.black]
line-length = 120

[tool.pytest.ini_options]
addopts = "--cov=listing_watch --cov-report=xml --cov-report=term"
DJANGO_SETTINGS_MODULE = "webui.settings"
testpaths = ["tests", "webui"]
pythonpath = ["webui"]
markers = ["cancel_request_poller: runs the real DB-polling stop signal instead of a never-firing one"]
