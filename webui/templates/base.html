{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}News Crawlers{% endblock %}</title>
    <script src="{% static 'crawler_manager/htmx.min.js' %}"></script>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
        nav { display: flex; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid #ddd; padding-bottom: 1rem; }
        nav a { text-decoration: none; color: #2563eb; }
        table { border-collapse: collapse; width: 100%; }
        th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #eee; }
        .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 0.75rem; font-size: 0.8rem; }
        .badge-pending, .badge-running { background: #fef3c7; color: #92400e; }
        .badge-success { background: #dcfce7; color: #166534; }
        .badge-failed { background: #fee2e2; color: #991b1b; }
        .badge-none { background: #f3f4f6; color: #6b7280; }
        .messages { list-style: none; padding: 0; }
        .messages li { padding: 0.5rem; margin-bottom: 0.5rem; background: #dcfce7; border-radius: 0.25rem; }
        form p { margin: 0.75rem 0; }
        .btn { padding: 0.35rem 0.8rem; border-radius: 0.25rem; border: 1px solid #ccc; background: #f9fafb; cursor: pointer; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'query_list' %}">Queries</a>
        <a href="{% url 'query_create' %}">Add query</a>
        <a href="/admin/crawler_manager/founditem/">Found items</a>
        <a href="/admin/crawler_manager/crawlrun/">Run history</a>
        <a href="/admin/">Admin</a>
    </nav>
    {% if messages %}
    <ul class="messages">
        {% for message in messages %}<li>{{ message }}</li>{% endfor %}
    </ul>
    {% endif %}
    {% block content %}{% endblock %}
</body>
</html>
