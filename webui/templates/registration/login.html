{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block nav %}
<nav class="topbar">
    <span class="brand">News Crawlers</span>
</nav>
{% endblock %}
{% block content %}
<div class="card" style="max-width: 360px; margin: 3rem auto;">
    <h1>Log in</h1>
    {% if form.errors %}
    <p style="color: var(--danger-text);">Your username and password didn't match. Please try again.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary" type="submit">Log in</button>
    </form>
</div>
{% endblock %}
