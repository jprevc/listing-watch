{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block nav %}
<nav class="topbar">
    <div class="topbar-inner">
        <span class="brand">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6">
                <circle cx="11" cy="11" r="8.2"></circle>
                <circle cx="11" cy="11" r="1.4" fill="currentColor" stroke="none"></circle>
                <line x1="11" y1="11" x2="11" y2="4.3" stroke-linecap="round"></line>
            </svg>
            Listing Watch
        </span>
    </div>
</nav>
{% endblock %}
{% block content %}
<div class="card" style="max-width: 360px; margin: 3rem auto;">
    <h1>Log in</h1>
    {% if form.errors %}
    <p style="color: var(--danger-text);">Your username and password didn't match. Please try again.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary" type="submit">Log in</button>
    </form>
</div>
{% endblock %}
